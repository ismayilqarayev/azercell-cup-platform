# main-ə hər push-dan sonra kodu Contabo VPS-ə yükləyir və AzCup konteynerlərini yenidən qurur.
# Lazım olan repo secret-ləri: VPS_SSH_KEY (azcup-github-actions şəxsi açarı), VPS_KNOWN_HOSTS (ssh-keyscan nəticəsi).
# Serverdə həmin açar yalnız /opt/azcup/ci-deploy.sh-i işlədə bilir (bax: deploy/ci-deploy.sh).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # frontend-src/*.html və kökdəki index.html saytın səhifəsinə (backend/.../static/index.html) yalnız bu skriptlə düşür —
      # kimsə onu lokal işlətməyi unutsa belə sayt mənbədən yığılsın.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Frontend-i yığ
        run: node tools/build-index.js

      - name: SSH hazırla
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Serverə yüklə və deploy et
        run: |
          tar czf - --exclude=.git backend deploy \
            | ssh -o BatchMode=yes -o ServerAliveInterval=30 root@169.58.100.131 "$GITHUB_SHA"

      - name: Sayt cavab verir?
        run: curl -fsS -o /dev/null -w '%{http_code}\n' --retry 5 --retry-delay 5 https://azcup.gencefritl.com/
