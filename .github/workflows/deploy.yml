# main-ə hər push-dan sonra əvvəlcə testləri işlədir, yalnız onlar keçəndə kodu Contabo VPS-ə yükləyir və AzCup konteynerlərini yenidən qurur.
# Lazım olan repo secret-ləri: VPS_SSH_KEY (azcup-github-actions şəxsi açarı), VPS_KNOWN_HOSTS (ssh-keyscan nəticəsi).
# Serverdə həmin açar yalnız /opt/azcup/ci-deploy.sh-i işlədə bilir (bax: deploy/ci-deploy.sh).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  # Testlər deploy-dan ƏVVƏL işləyir: əvvəl onlar yalnız tərtibatçının kompüterində işlədilirdi (serverdəki Docker yığımı -DskipTests ilədir),
  # yəni sınıq kod canlıya çıxa bilərdi. İndi hər hansı test uğursuz olsa deploy işi başlamır.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # BackendApplicationTests tətbiqi adi profillə (real Postgres ilə) qaldırır; qalan inteqrasiya testləri yaddaşdakı H2-dən istifadə edir.
      # İstifadəçi/parol application.yml-dəki açıq default dəyərlərdir və yalnız bu müvəqqəti CI bazasına aiddir.
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: azcup
          POSTGRES_PASSWORD: azcup
          POSTGRES_DB: azcup
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U azcup"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Frontend testləri
        run: node --test tools/*.test.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Hakim (judge) testləri real g++ ilə işləyir; o, ubuntu-latest-də quraşdırılıb.
      - name: Backend testləri
        working-directory: backend
        run: bash ./mvnw -B -q test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # frontend-src/*.html və kökdəki index.html saytın səhifəsinə (backend/.../static/index.html) yalnız bu skriptlə düşür —
      # kimsə onu lokal işlətməyi unutsa belə sayt mənbədən yığılsın.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Frontend-i yığ
        run: node tools/build-index.js

      # Server arxivi köhnə qovluğun üstünə açır, ona görə repodan silinən fayl orada qalır və yığımı sındıra bilir.
      # Bu siyahı arxivlə birlikdə gedir; deploy.sh siyahıda olmayan backend/src fayllarını yığımdan əvvəl silir.
      # Son sətirdəki "#END <say>" bütövlük möhürüdür: siyahı yarımçıq çatsa server heç nə silmir (bax: deploy/prune-stale-sources.sh).
      - name: Mənbə fayllarının siyahısı
        run: |
          (cd backend && find src -type f | LC_ALL=C sort) > deploy/backend-src.manifest
          echo "#END $(wc -l < deploy/backend-src.manifest | tr -d ' ')" >> deploy/backend-src.manifest
          tail -n 1 deploy/backend-src.manifest

      - name: SSH hazırla
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Serverə yüklə və deploy et
        run: |
          tar czf - --exclude=.git backend deploy \
            | ssh -o BatchMode=yes -o ServerAliveInterval=30 root@169.58.100.131 "$GITHUB_SHA"

      - name: Sayt cavab verir?
        run: curl -fsS -o /dev/null -w '%{http_code}\n' --retry 5 --retry-delay 5 https://azcup.gencefritl.com/
