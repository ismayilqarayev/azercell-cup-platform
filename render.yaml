services:
  - type: web
    name: azcup-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      # Verilənlər bazası Render-in öz (30 gündən sonra bitən pulsuz) Postgres-i
      # ƏVƏZİNƏ Neon-da saxlanılır — dəyərlər Render dashboard-unda əl ilə
      # təyin olunmalıdır (bax: DEPLOY.md və ya söhbətdəki izah).
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
