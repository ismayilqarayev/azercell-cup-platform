# AzCup (Azercell Cup platforması) — Contabo VPS-də /opt/azcup/app/deploy qovluğundan işləyir.
# Gəncə FRİTL saytının stack-indən (/opt/gence-fritl) TAMAMİLƏ AYRIDIR: ayrı Docker şəbəkələri, ayrı Postgres, ayrı volume.
# Səbəb: bu xidmət şagirdlərin C++ kodunu serverdə işlədir — o kod nə Gəncə bazasına, nə də başqa konteynerlərə çata bilməməlidir.
#
# Şəbəkələr:
#   internal — yalnız Postgres + backend; internal:true olduğu üçün Postgres-in İNTERNETƏ çıxışı yoxdur.
#   web      — backend + Gəncə stack-indəki Caddy (HTTPS və yönləndirmə). Caddy yalnız bu şəbəkəyə qoşulur, DB-yə çatmır.
# Postgres və backend kənara port AÇMIR; yalnız Caddy 80/443-ü dinləyir (o, Gəncə stack-indədir, bax: README/DEPLOY).
name: azcup

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Baku
    # Postgres 18 şəkli məlumatı /var/lib/postgresql/18/docker altında saxlayır — volume bir üst qovluğa qoşulur.
    volumes:
      - pgdata:/var/lib/postgresql
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 12
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=40"]
    mem_limit: 768m
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]   # Postgres şəklinin işə düşməsi üçün minimum
    security_opt: ["no-new-privileges:true"]

  # DİQQƏT: xidmətin adı BİLƏREKDƏN "azcup-backend"-dir. Docker xidmət adını qoşulduğu hər şəbəkədə alias edir; ortaq
  # azcup_web şəbəkəsində Gəncənin Caddy-si "backend" adını Gəncənin öz backend-i üçün işlədir — burada da "backend" olsaydı
  # ad ikiyə həll olunar və Gəncə trafiki AzCup-a düşərdi (502). Ona görə xidmət adları unikal saxlanılır.
  azcup-backend:
    build: ../backend
    image: azcup-backend:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSLMODE: disable            # eyni host daxili şəbəkəsidir, TLS lazım deyil
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # Şagird kodu ayrıca uid-lərlə, limitlər altında işləyir (bax: backend JudgeSandbox). 61000 — uid hovuzunun başlanğıcı
      # (61000..61003); başqa konteynerlərdə işlənməyən uid-lər seçilib (RLIMIT_NPROC hostda uid üzrə sayılır, "nobody" ilə
      # toqquşmasın deyə). Eyni anda ən çox JUDGE_UID_POOL yoxlama gedir, qalanı növbə gözləyir.
      JUDGE_RUN_AS_UID: "61000"
      JUDGE_UID_POOL: "4"
      JUDGE_MAX_PROCESSES: "64"
      JUDGE_MAX_MEMORY_MB: "1024"
      JUDGE_MAX_CPU_SECONDS: "10"
      JUDGE_MAX_FILE_MB: "16"
      TZ: Asia/Baku
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=45
    networks:
      internal: {}
      web: {}      # Gəncə Caddy-si bu şəbəkədə "azcup-backend" adı ilə çağırır
    # Konteyner özü sərtləşdirilir: kök fayl sistemi yalnız oxunur, yazılan yeganə yer /tmp (judge iş qovluğu; "exec" lazımdır —
    # compile olunmuş proqramlar oradan işləyir). Hüquqların hamısı alınır, yalnız şagird kodunun uid-ini dəyişmək üçün
    # SETUID/SETGID qalır. no-new-privileges yeni hüquq almağı bağlayır.
    # NET_ADMIN/NET_RAW/SETPCAP YALNIZ giriş skripti üçündür (docker-entrypoint.sh): o, şagird uid-lərinin şəbəkə çıxışını
    # iptables ilə bağlayır və Java başlamazdan əvvəl bu üç hüququ bounding set-dən ATIR — işləyən tətbiqdə (CapBnd=0xc0) yoxdur.
    read_only: true
    tmpfs:
      - /tmp:rw,exec,nosuid,size=512m,mode=1777
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, NET_ADMIN, NET_RAW, SETPCAP]
    security_opt: ["no-new-privileges:true"]
    # Resurs tavanı: kompilyasiya "fırtınası" Gəncə saytını (eyni server) ləngitməsin.
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2.0
    pids_limit: 512

networks:
  internal:
    internal: true
  # Ortaq şəbəkə AzCup stack-indən MÜSTƏQİLDİR (external): AzCup dayandırılsa/silinsə belə Gəncənin Caddy-si (bu şəbəkəyə
  # qoşulu) qalxmağa davam edir. İlk dəfə install.sh/deploy.sh yaradır: docker network create azcup_web
  web:
    name: azcup_web
    external: true

volumes:
  pgdata:
